<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SIMPUS-mini | Tambah anggota</title>
        <body>
            <header>
                <nav>
                    <ul>
                        <h2>Tambah Anggota</h2>
                        <li><a href="index.html">Beranda</a></li>
                        <li><a href="daftar-anggota.html">Daftar Anggota</li>
                        <li><a href="tambah-anggota.html">Tambah Anggota</
                    </ul>
                </nav>
            </header>
            <main>
                <selection>
                    <span>* (wajib diisi)</span>
                    <h2>Tambah Anggota</h2>
                    <p>
                        <label for="nama">Nama</label>,<br>
                        <input type="text" id="nama" name="nama_lengkap"required>
                    </p>
                    <p>
                        <label for="email">Email</label>,<br>
                        <input type="Email" id="email" name="email" required>
                    </p>
                    <p> 
                        <label for="no_anggota">No. Anggota</label>,<br>
                        <input type="text" id="no_anggota" name="no_anggota" required>
                    </p>
                    <p> 
                        <label for="no_telp">No. Telepon</label>
                        <input type="text" id="no_telp" name="no_telp" required>
                    </p>
                    <p>
                        <label for="alamat">Alamat</label>,<br>
                        <textarea id="alamat" rows="10" cols="30" name="alamat" required></textarea>
                        <input type="text" id="alamat" name="alamat" required>
                    </p>
                    <p>
                        <label for="no_hp">No. HP</label>
                        <input type="number" id="no_hp" name="no_hp" required>
                    </p>
                    <button type="submit">Tambah Anggota</button>
                </selection>
            </main>
        </body>
    </head>
